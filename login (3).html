{% extends "base.html" %}
{% block title %}Ingresar · Panel Frank{% endblock %}
{% block content %}
<section class="page-narrow">
  <span class="module-badge">Frank</span>
  <h1>Panel del administrador</h1>
  <p class="lead">Gestiona documentación, notas, observaciones y seguimiento de los practicantes.</p>

  <form method="post" action="{{ url_for('frank_login') }}" class="stacked-form login-form">
    <label>Usuario
      <input type="text" name="usuario" placeholder="admin" required autofocus>
    </label>
    <label>Contraseña
      <input type="password" name="password" placeholder="••••••••" required>
    </label>
    <button type="submit" class="btn-primary full">Iniciar sesión</button>
  </form>

  <div class="demo-box"><strong>Usuario de prueba:</strong> <code>admin</code> / <code>admin123</code></div>
</section>
{% endblock %}
